services:
  database:
    build:
      context: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network
    restart: unless-stopped

  backend:
    build:
      context: ./sample-application-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - db-network
      - proxy-network
    depends_on:
      - database
    restart: unless-stopped

  httpd:
    build:
      context: ../http-server
    ports:
      - "80:80"
    networks:
      - proxy-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  db-network:
  proxy-network:

volumes:
  postgres-data: